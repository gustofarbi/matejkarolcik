colorScheme = "slate"
defaultAppearance = "light"
autoSwitchAppearance = true

defaultThemeColor = "#ffffff"

enableSearch = true
enableCodeCopy = true
enableImageLazyLoading = true
enableImageWebp = true

fingerprintAlgorithm = "sha256"

# Only the blog feeds the homepage "recent" list and RSS. Without this, Hugo
# infers mainSections from whichever section has the most pages — which flips
# to "work" as soon as a third case study lands.
mainSections = ["posts"]

[header]
  layout = "basic"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"
  showRecent = false
  recentLimit = 3

[article]
  showDate = true
  showDateUpdated = true
  showAuthor = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = false
  showComments = false
  sharingLinks = ["x-twitter", "email"]

[list]
  showSummary = true
  groupByYear = true

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
