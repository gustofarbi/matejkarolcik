{{/* One row of the case-study index. Shared by the landing page and /work. */}}
<li class="pf-index-row">
  <h3 class="pf-index-title"><a href="{{ .RelPermalink }}">{{ .Title | emojify }}</a></h3>
  <div>
    {{ with .Params.summary }}
      <p class="pf-index-note">{{ . | emojify }}</p>
    {{ end }}
    {{ with .Params.stack }}
      <ul class="pf-index-stack">
        {{ range . }}<li>{{ . }}</li>{{ end }}
      </ul>
    {{ end }}
  </div>
</li>
